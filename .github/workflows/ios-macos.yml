name: ios-macos

# Compiles the iOS app. Most of Linea's logic lives in `Linea/Core` and is
# covered by the Linux job, but everything that touches SwiftUI, SwiftData,
# HealthKit or UserNotifications can only be checked here.
#
# The runner label is an input because the project needs Xcode 26 (deployment
# target 26.5). If `macos-26` is not yet available to this account, re-run the
# workflow with `macos-15` and see the "Toolchain" step for what it has.

on:
  push:
    branches: [main, "feature/**", "fix/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner image label (macos-26 / macos-15 / macos-latest)"
        default: "macos-26"
        type: string

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ inputs.runner || 'macos-26' }}
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          echo "Available Xcode versions:"
          ls -d /Applications/Xcode*.app || true
          # Prefer Xcode 26; fall back to the newest installed one and say so.
          if [ -d /Applications/Xcode_26.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.app
          else
            newest="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)"
            echo "::warning::Xcode 26 not found, falling back to $newest"
            [ -n "$newest" ] && sudo xcode-select -s "$newest"
          fi
          xcodebuild -version
          swift --version

      - name: Schemes
        run: xcodebuild -project Linea.xcodeproj -list

      - name: Core tests on the Apple toolchain
        run: swift test

      # The speech model (~233 MB) is not in git: the "Speech model" build phase
      # downloads it into ~/Library/Caches/Linea and copies it into the app.
      # Caching that folder saves the download on every run.
      - name: Speech model cache
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Linea
          key: speech-model-${{ hashFiles('Scripts/fetch-speech-model.sh') }}

      # The build never fails this step: the next one prints a readable list of
      # errors first and only then fails the job. Otherwise the useful lines are
      # buried in ~900 lines of xcodebuild output.
      - name: Build the app
        id: build
        run: |
          set -o pipefail
          xcodebuild \
            -project Linea.xcodeproj \
            -scheme Linea \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build.log
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Errors and warnings
        run: |
          {
            echo "### Ошибки сборки"
            echo '```'
            grep -E "error:" build.log | sed 's|^.*/liniya_app/||' | sort -u | head -100 \
              || echo "(ошибок нет)"
            echo '```'
            echo "### Предупреждения"
            echo '```'
            grep -E "warning:" build.log | sed 's|^.*/liniya_app/||' | sort -u | head -50 \
              || echo "(предупреждений нет)"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit ${{ steps.build.outputs.status }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
